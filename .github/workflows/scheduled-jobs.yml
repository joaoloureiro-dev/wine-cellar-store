name: Scheduled jobs

# Runs the expiry job through the public domain, so it reaches whichever
# deployment (Vercel or Railway) is serving traffic. The endpoint is
# idempotent: overlapping or repeated runs are harmless.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  expire-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expire unpaid orders and overdue reservations
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set yet; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/expire-orders"
